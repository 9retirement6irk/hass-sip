dial:
  name: Dial
  description: Initiate a SIP call to a specified number or SIP URI.
  target:
    entity:
      integration: sip
      domain: media_player
  fields:
    number:
      name: Number
      description: The extension number or full SIP URI to dial (e.g. 100, sip:100@freepbx).
      required: true
      example: "100"
      selector:
        text:
    menu:
      name: IVR Menu
      description: Optional IVR menu dictionary structure to start when the call connects.
      required: false
      example:
        id: "greet_menu"
        message: "Welcome. Press 1 to speak to the family."
        tts_engine: "tts.google_translate"
        language: "en"
        choices:
          "1":
            post_action: "hangup"
      selector:
        object:
    ring_timeout:
      name: Ring Timeout
      description: Duration in seconds to wait for the call to ring before canceling the dial attempt.
      required: false
      example: 30
      selector:
        number:
          min: 1
          max: 300
          step: 1
          unit_of_measurement: seconds
    message:
      name: Message
      description: Optional text message to speak via TTS upon call connection. Supports Jinja templates.
      required: false
      example: "Hello, this is Home Assistant. The current time is {{ now().strftime('%H:%M') }}."
      selector:
        text:
          multiline: true
    tts_engine:
      name: TTS Engine
      description: Optional TTS engine entity ID to use for speaking the message.
      required: false
      example: "tts.google_translate"
      selector:
        entity:
          domain: tts
    language:
      name: Language
      description: Optional language code for speech output (e.g. ko, en).
      required: false
      example: "ko"
      selector:
        text:
    tts_options:
      name: TTS Options
      description: Optional configuration options dictionary passed to the selected TTS engine (e.g. voice or quality).
      required: false
      example:
        voice: "ko-KR-SunHiNeural"
      selector:
        object:

hangup:
  name: Hang up
  description: End the active SIP call, or decline/busy an incoming call.
  target:
    entity:
      integration: sip
      domain: media_player
  fields:
    sip_code:
      name: SIP Status Code
      description: Optional SIP status code to send if hanging up a ringing incoming call (e.g. 486 for Busy Here, 603 for Decline).
      required: false
      example: 486
      selector:
        number:
          min: 100
          max: 699
          step: 1

answer:
  name: Answer
  description: Answer an incoming SIP call.
  target:
    entity:
      integration: sip
      domain: media_player
  fields:
    menu:
      name: IVR Menu
      description: Optional IVR menu dictionary structure to start immediately upon answering.
      required: false
      example:
        id: "incoming_menu"
        message: "Press 1 to unlock the door."
        tts_engine: "tts.google_translate"
        language: "en"
        choices:
          "1":
            action:
              domain: "lock"
              service: "unlock"
              entity_id: "lock.front_door"
            post_action: "hangup"
      selector:
        object:
    message:
      name: Message
      description: Optional text message to speak via TTS upon answering. Supports Jinja templates.
      required: false
      example: "Connecting you now."
      selector:
        text:
          multiline: true
    tts_engine:
      name: TTS Engine
      description: Optional TTS engine entity ID to use for speaking the message.
      required: false
      example: "tts.google_translate"
      selector:
        entity:
          domain: tts
    language:
      name: Language
      description: Optional language code for speech output (e.g. ko, en).
      required: false
      example: "ko"
      selector:
        text:
    tts_options:
      name: TTS Options
      description: Optional configuration options dictionary passed to the selected TTS engine (e.g. voice or quality).
      required: false
      example:
        voice: "ko-KR-SunHiNeural"
      selector:
        object:

send_dtmf:
  name: Send DTMF
  description: Send DTMF digits to the active SIP call.
  target:
    entity:
      integration: sip
      domain: media_player
  fields:
    digits:
      name: Digits
      description: DTMF keypress string to send (e.g. 123#).
      required: true
      example: "123#"
      selector:
        text:

start_recording:
  name: Start Recording
  description: Start recording call audio to a local WAV file.
  target:
    entity:
      integration: sip
      domain: media_player
  fields:
    recording_file:
      name: Recording File Path
      description: Path of the WAV file to save (must end in .wav; relative paths go under the local media directory). Supports Jinja templates and target variables.
      required: true
      example: "/media/voicemails/call_{{ username }}_{{ now().strftime('%Y%m%d_%H%M%S') }}.wav"
      selector:
        text:

stop_recording:
  name: Stop Recording
  description: Stop active call recording.
  target:
    entity:
      integration: sip
      domain: media_player

start_assist:
  name: Start Assist
  description: Connect the active call to Home Assistant's Voice Assist pipeline for multi-turn conversation.
  target:
    entity:
      integration: sip
      domain: media_player
  fields:
    pipeline_id:
      name: Assist pipeline
      description: Optional Assist pipeline ID. Uses the default pipeline when omitted.
      required: false
      selector:
        assist_pipeline:
    conversation_id:
      name: Conversation ID
      description: Optional existing conversation ID to continue. Use the same conversation agent; expired sessions may start a new conversation.
      required: false
      selector:
        text:
    initial_prompt:
      name: Initial prompt
      description: Text sent to the conversation agent before listening. The response is played to the caller.
      required: false
      selector:
        text:
          multiline: true
    system_prompt:
      name: System prompt
      description: Additional instructions supplied to the conversation agent on every turn. Does not start a turn or play audio by itself.
      required: false
      selector:
        text:
          multiline: true
    max_turns:
      name: Max turns
      description: Maximum conversation turns before the session ends. 0 means unlimited.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 100
          mode: box
    max_silent_turns:
      name: Max silent turns
      description: End the session after this many consecutive turns with no speech recognized.
      required: false
      default: 2
      selector:
        number:
          min: 1
          max: 10
          mode: box
    barge_in:
      name: Barge-in
      description: Allow interrupting TTS by speaking (requires pymicro_vad; default false; may self-trigger on speakerphones without echo cancellation).
      required: false
      default: false
      selector:
        boolean:
    include_call_start:
      name: Include call start
      description: Start the first turn with the audio heard since the call connected (up to 4 s), so words said at pickup, before Assist was listening, are not lost. Use on outgoing calls; only the first Assist on a call can use it.
      required: false
      default: false
      selector:
        boolean:
    listen_while_speaking:
      name: Listen while speaking
      description: Keep listening while Assist talks, without interrupting it. Speech the caller starts during a reply is kept and answered once the reply has finished; noise never cuts a reply short. Takes precedence over barge-in (requires pymicro_vad; default false).
      required: false
      default: false
      selector:
        boolean:
    interrupt_on_words:
      name: Interrupt after words
      description: With live transcription running, stop a reply once the caller has said this many recognised words over it (0 = never). Unlike barge-in this needs real words, so noise cannot cut a reply short.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 50
          mode: box
    silence_seconds:
      name: Silence timeout
      description: Seconds of silence that end a spoken command. Assist defaults to 0.7; phone lines usually need 1.0-1.5 so callers are not cut off mid-sentence.
      required: false
      example: 1.2
      selector:
        number:
          min: 0.3
          max: 5.0
          step: 0.1
          unit_of_measurement: s
          mode: box
    noise_suppression:
      name: Noise suppression
      description: Noise suppression level applied to caller audio (0 = off, 4 = max). Helps on noisy narrowband G.711 lines.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 4
          mode: box
    turn_tone:
      name: Turn start tone
      description: Play a short beep when it is the caller's turn to speak (default false). Helps callers know when the microphone is open after TTS. Skipped when barge-in already captured speech.
      required: false
      default: false
      selector:
        boolean:
    turn_tone_media:
      name: Turn start tone media
      description: Home Assistant media to play for the turn-start tone instead of the default beep. A media source ID (e.g. picked from the media browser) or a URL. Leave empty to use the default beep.
      required: false
      selector:
        text:
    processing_tone:
      name: Processing tone
      description: Repeat a short beep from the moment speech is recognized until the reply audio is ready, covering LLM, action and TTS wait time (default false). Stops as soon as the reply starts playing.
      required: false
      default: false
      selector:
        boolean:
    processing_tone_media:
      name: Processing tone media
      description: Home Assistant media to loop for the processing tone instead of the default repeating beep. A media source ID (e.g. picked from the media browser) or a URL. Leave empty to use the default beep.
      required: false
      selector:
        text:
    hangup_on_end:
      name: Hang up on end
      description: Hang up the call when the Assist session ends.
      required: false
      default: false
      selector:
        boolean:
    allow_llm_hangup:
      name: Allow Assist to hang up
      description: Expose a SIP-specific Hang Up tool to Assist. The call ends after the current turn and its spoken response finish.
      required: false
      default: false
      selector:
        boolean:
    interrupt_media:
      name: Interrupt media
      description: Stop and discard current media playback when Assist is ready to listen or play its first response. Media may continue during pipeline, LLM, and TTS warm-up. Set to false to let the current playback finish before Assist's first turn.
      required: false
      default: true
      selector:
        boolean:
    allowed_callers:
      name: Allowed callers
      description: Caller IDs that may start Assist. Omitted means no restriction. Caller ID can be spoofed; pair with PIN for door-lock intents.
      required: false
      example:
        - "100"
        - "101"
      selector:
        text:
          multiple: true
    contacts_only:
      name: Contacts only
      description: Only callers listed in sip_contacts.json may start Assist. Combined with Allowed callers, both must match.
      required: false
      default: false
      selector:
        boolean:
    pin:
      name: PIN
      description: Optional DTMF PIN entered before Assist starts. Failed or timed-out attempts fire sip_assist_rejected and do not run intents.
      required: false
      selector:
        text:
          type: password

bridge:
  name: Conference lines
  description: Merge the active calls of two or more phone lines into one conference. Everybody hears everybody, including Assist or media playing on any of the lines. The conference ends for a line when its call ends or when it is unbridged.
  target:
    entity:
      integration: sip
      domain: media_player

unbridge:
  name: Split conference
  description: Take the targeted phone lines out of any conference. Their calls stay connected, separately.
  target:
    entity:
      integration: sip
      domain: media_player

get_transcript:
  name: Get transcript
  description: Return what was said in the phone line's latest Assist conversation (caller speech as recognised, and the spoken replies). Kept after the call ends until the next conversation on that line starts.
  target:
    entity:
      integration: sip
      domain: media_player
  fields:
    conversation_id:
      name: Conversation ID
      description: Optional. Only return the transcript if it belongs to this conversation.
      required: false
      selector:
        text:

start_transcription:
  name: Start live transcription
  description: Transcribe what the far end says, phrase by phrase, for the rest of the call - also while Assist is replying. Each phrase fires a sip_live_transcript event, is returned by Get transcript, and phrases said over an Assist reply are passed to its next turn.
  target:
    entity:
      integration: sip
      domain: media_player
  fields:
    pipeline_id:
      name: Assist pipeline
      description: Use this pipeline's speech-to-text engine and language (the preferred pipeline when empty).
      required: false
      selector:
        assist_pipeline:
    stt_engine:
      name: Speech-to-text entity
      description: Optional. A specific stt entity to use instead of the pipeline's.
      required: false
      selector:
        entity:
          domain: stt
    language:
      name: Language
      description: Optional language code, e.g. en.
      required: false
      selector:
        text:

stop_transcription:
  name: Stop live transcription
  description: Stop live transcription on the targeted phone lines (it also stops when the call ends).
  target:
    entity:
      integration: sip
      domain: media_player
